##############################################################################
#   Picom — Equilibrio rendimiento VMware / visualidad   (S4)
#   Backend glx + blur dual_kawase bajo (requiere picom >= 10, extra/picom)
#   Aceleración 3D de VMware (open-vm-tools + SVGA) soporta este pipeline.
##############################################################################

############################################
#              GENERAL / RENDIMIENTO        #
############################################

backend = "glx";

# glx-no-stencil eliminado: deprecado upstream (commit yshui/picom 2024-10-13
# 'config: deprecate glx-no-stencil and glx-no-rebind-pixmap'); picom >=12/13
# lo marca como opcion ofensiva y GLX moderno no usa stencil.

# Sincroniza con el refresco: evita tearing (glx lo necesita)
vsync = true;

# Solo repinta las zonas dañadas: imprescindible en VM
use-damage = true;

# Devuelve la pantalla al WM cuando no hay ventanas translúcidas (gana FPS)
unredir-if-possible = true;

log-level = "warn";

############################################
#                   BLUR                    #
############################################

blur-background = true;
blur-method = "dual_kawase";
blur-size = 5;
blur-strength = 3;
blur-background-frame = false;
blur-background-fixed = false;

blur-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

############################################
#            ESQUINAS REDondeadas           #
############################################

corner-radius = 12;

rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

round-borders = 12;
round-borders-exclude = [
  "class_g = 'polybar'"
];

round-borders-rule = [];

############################################
#                 SHADOWS                   #
############################################

shadow = true;
shadow-radius = 9;
shadow-opacity = 0.5;
shadow-offset-x = -7;
shadow-offset-y = -7;

shadow-exclude = [
  "class_g = 'firefox' && argb",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

############################################
#                 FADING                    #
############################################

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;
no-fading-openclose = false;

############################################
#                 OPACITY                   #
############################################

inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity = 1.0;

focus-exclude = [ "class_g = 'Cairo-clock'" ];

############################################
#            DETECCIÓN / VENTANAS           #
############################################

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.9; full-shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  dropdown_menu = { shadow = false; };
  popup_menu = { shadow = false; };
  utility = { shadow = false; };
};
